<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Portafolio Tony Coy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500&display=swap">
<style>
/* Layout: cabecera fija amarilla, filtros por categoría y mosaico de columnas con visor ampliado. */
:root{
  --bg:#FAF8F2; --fg:#141414; --muted:#5F5B50; --line:#E4E0D3; --card:#FFFFFF;
  --amarillo:#FFE15A; --negro:#141414; --azul:#12284A; --arena:#6E6350;
  --sans:'Poppins',system-ui,sans-serif; --serif:'Playfair Display',Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#F3F0E6;--muted:#B0AC9F;--line:#2C2B27;--card:#1B1B19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--fg:#F3F0E6;--muted:#B0AC9F;--line:#2C2B27;--card:#1B1B19;color-scheme:dark}
*{box-sizing:border-box}
html{padding:0}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6}
a{color:inherit}
.in{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) :focus-visible{outline-color:var(--amarillo)}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--amarillo);color:var(--negro)}
header .in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand{display:flex;flex-direction:column;line-height:1;text-decoration:none}
.brand b{font-weight:700;font-size:24px;letter-spacing:-.05em}
.brand span{font-size:7px;letter-spacing:.55em;margin-top:5px;color:var(--arena)}
.btn{display:inline-block;background:var(--negro);color:#FAF8F2;font-weight:600;font-size:14px;padding:11px 22px;border-radius:999px;text-decoration:none;border:2px solid var(--negro)}
.btn:hover{background:transparent;color:var(--negro)}
.top{display:flex;gap:18px;align-items:center}
.top a.l{font-size:14px;font-weight:500;text-decoration:none}
.top a.l:hover{text-decoration:underline;text-underline-offset:4px}
@media (max-width:560px){.top a.l{display:none}}
.head{padding-block:56px 20px}
.head p.e{font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:0 0 10px}
h1{font-size:clamp(34px,6vw,60px);line-height:1;letter-spacing:-.045em;font-weight:700;margin:0 0 12px;text-wrap:balance}
.head p.s{font-family:var(--serif);font-style:italic;font-size:clamp(18px,2.4vw,24px);margin:0;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding-block:20px 28px}
.filters button{font:inherit;font-size:14px;font-weight:500;background:transparent;color:var(--fg);border:1.5px solid var(--fg);border-radius:999px;padding:7px 16px;cursor:pointer}
.filters button:hover{background:var(--line)}
.filters button[aria-pressed="true"]{background:var(--amarillo);border-color:var(--amarillo);color:var(--negro);font-weight:600}
.filters small{opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}
.wall{column-count:4;column-gap:12px;padding-bottom:72px}
@media (max-width:1000px){.wall{column-count:3}}
@media (max-width:640px){.wall{column-count:2;column-gap:8px}}
.wall button{display:block;width:100%;margin:0 0 12px;padding:0;border:0;border-radius:12px;overflow:hidden;cursor:zoom-in;background:var(--line);break-inside:avoid;position:relative}
@media (max-width:640px){.wall button{margin-bottom:8px}}
.wall img{display:block;width:100%;height:auto;transition:transform .5s}
.wall button:hover img{transform:scale(1.03)}
@media (prefers-reduced-motion:reduce){.wall img{transition:none}}
.cta{background:var(--amarillo);color:var(--negro);padding-block:56px}
.cta .in{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.cta h2{margin:0;font-size:clamp(24px,3.6vw,36px);letter-spacing:-.04em;line-height:1.1;max-width:20ch}
.cta .btn{background:var(--negro);color:#FAF8F2;border-color:var(--negro);font-size:15px;padding:13px 26px}
.cta .btn:hover{background:transparent;color:var(--negro)}
footer{padding-block:24px calc(24px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:13px}
footer .in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
/* Visor */
dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;width:100%;height:100%}
dialog::backdrop{background:rgba(10,10,10,.92)}
.lb{position:fixed;inset:0;display:grid;grid-template-rows:1fr auto;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));gap:10px}
.lb .stage{display:flex;align-items:center;justify-content:center;min-height:0}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lb .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#F3F0E6;font-size:14px}
.lb .bar button{font:inherit;background:var(--amarillo);color:var(--negro);border:0;border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer}
.lb .bar .n{display:flex;gap:8px}
.lb .bar span{font-variant-numeric:tabular-nums;opacity:.8}
</style>
</head>
<body>
<header>
  <div class="in">
    <a class="brand" href="index.html" aria-label="Tony Coy Visual Studio, inicio"><b>TonyCoy</b><span>VISUAL STUDIO</span></a>
    <div class="top">
      <a class="l" href="index.html">Inicio</a>
      <a class="btn" href="https://wa.me/523141603146?text=Hola%2C%20vi%20su%20portafolio%20y%20quiero%20cotizar" target="_blank" rel="noopener">Cotizar</a>
    </div>
  </div>
</header>

<main>
  <div class="in head">
    <p class="e">Portafolio</p>
    <h1>Momentos que duran para siempre</h1>
    <p class="s">Sesiones reales en la costa de Colima.</p>
  </div>
  <div class="in">
    <div class="filters" id="filters" role="group" aria-label="Filtrar por categoría"></div>
    <div class="wall" id="wall"></div>
  </div>
</main>

<section class="cta">
  <div class="in">
    <h2>¿Quieres tu propia sesión?</h2>
    <a class="btn" href="https://wa.me/523141603146?text=Hola%2C%20vi%20su%20portafolio%20y%20quiero%20cotizar" target="_blank" rel="noopener">Cotizar por WhatsApp</a>
  </div>
</section>
<footer><div class="in"><span>© Tony Coy Visual Studio</span><span>Manzanillo, Colima · 314 160 3146</span></div></footer>

<dialog id="lb" aria-label="Foto ampliada">
  <div class="lb">
    <div class="stage"><img id="lbimg" alt=""></div>
    <div class="bar">
      <span id="lbcount"></span>
      <div class="n"><button id="prev" type="button">Anterior</button><button id="next" type="button">Siguiente</button><button id="close" type="button">Cerrar</button></div>
    </div>
  </div>
</dialog>

<script>
var CATS=[['todo','Todo'],['xv','XV años'],['boda','Bodas'],['mat','Maternidad'],['fam','Familia'],['comp','Compromiso'],['inf','Infantil']];
var ALT={xv:'Sesión de XV años',boda:'Fotografía de boda',mat:'Sesión de maternidad',fam:'Sesión familiar',comp:'Sesión de compromiso',inf:'Sesión infantil'};
var P=[['xv','xv-51.jpg'],['xv','xv-50.jpg'],['xv','xv-49.jpg'],['xv','xv-43.jpg'],['xv','xv-34.jpg'],['xv','xv-35.jpg'],['xv','xv-45.jpg'],['boda','boda-14.jpg'],['boda','boda-15.jpg'],['boda','boda-16.jpg'],['boda','boda-17.jpg'],['boda','boda-18.jpg'],['boda','boda-20.jpg'],['boda','boda-21.jpg'],['boda','boda-22.jpg'],['boda','boda-23.jpg'],['boda','boda-24.jpg'],['boda','boda-26.jpg'],['mat','mat-1.jpg'],['mat','mat-2.jpg'],['mat','mat-3.jpg'],['mat','mat-9.jpg'],['mat','mat-10.jpg'],['mat','mat-12.jpg'],['mat','mat-29.jpg'],['mat','mat-31.jpg'],['mat','mat-32.jpg'],['mat','mat-33.jpg'],['mat','mat-36.jpg'],['mat','mat-37.jpg'],['mat','mat-38.jpg'],['mat','mat-39.jpg'],['mat','mat-40.jpg'],['mat','mat-41.jpg'],['mat','mat-42.jpg'],['mat','mat-44.jpg'],['fam','fam-6.jpg'],['fam','fam-7.jpg'],['fam','fam-8.jpg'],['fam','fam-11.jpg'],['fam','fam-13.jpg'],['comp','comp-46.jpg'],['comp','comp-47.jpg'],['comp','comp-48.jpg'],['inf','inf-27.jpg'],['inf','inf-28.jpg'],['inf','inf-30.jpg']];
var cur='todo', shown=[], idx=0;
var wall=document.getElementById('wall'), filters=document.getElementById('filters'), lb=document.getElementById('lb'), lbimg=document.getElementById('lbimg'), lbcount=document.getElementById('lbcount');

function count(c){return c==='todo'?P.length:P.filter(function(p){return p[0]===c}).length}
function renderFilters(){
  filters.innerHTML='';
  CATS.forEach(function(c){
    var b=document.createElement('button'); b.type='button'; b.setAttribute('aria-pressed',String(c[0]===cur));
    b.innerHTML=c[1]+'<small>'+count(c[0])+'</small>';
    b.onclick=function(){setCat(c[0],true)};
    filters.appendChild(b);
  });
}
function renderWall(){
  wall.innerHTML='';
  shown=P.filter(function(p){return cur==='todo'||p[0]===cur});
  shown.forEach(function(p,i){
    var b=document.createElement('button'); b.type='button'; b.setAttribute('aria-label','Ampliar foto '+(i+1)+' de '+shown.length+': '+ALT[p[0]]);
    var im=document.createElement('img'); im.src='img/fotos/'+p[1]; im.alt=ALT[p[0]]; im.loading='lazy'; im.decoding='async';
    b.appendChild(im); b.onclick=function(){openLb(i)}; wall.appendChild(b);
  });
}
function setCat(c,push){
  cur=c; renderFilters(); renderWall();
  if(push){try{history.replaceState(null,'','#'+c)}catch(e){}}
}
function openLb(i){idx=i;showLb();if(!lb.open)lb.showModal();document.getElementById('close').focus()}
function showLb(){var p=shown[idx];lbimg.src='img/fotos/'+p[1];lbimg.alt=ALT[p[0]];lbcount.textContent=ALT[p[0]]+' · '+(idx+1)+' / '+shown.length}
function step(d){idx=(idx+d+shown.length)%shown.length;showLb()}
document.getElementById('prev').onclick=function(){step(-1)};
document.getElementById('next').onclick=function(){step(1)};
document.getElementById('close').onclick=function(){lb.close()};
lb.addEventListener('click',function(e){if(e.target===lb)lb.close()});
document.addEventListener('keydown',function(e){if(!lb.open)return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
var h=(location.hash||'').replace('#','');
setCat(CATS.some(function(c){return c[0]===h})?h:'todo',false);
</script>
</body>
</html>
